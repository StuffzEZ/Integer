<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integer Control Room</title><style>
:root{--ink:#17212b;--muted:#687681;--paper:#edf1ed;--card:#fff;--accent:#0d8b78;--line:#ced8d3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#dce9e5,#f4efe5 55%,#e7d9ce);color:var(--ink);font:15px Arial,sans-serif}main{width:min(1100px,calc(100% - 32px));margin:auto;padding:36px 0 70px}header{display:flex;align-items:end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:18px}h1{font:700 clamp(2.2rem,7vw,5rem) Georgia,serif;margin:0}h2{font:700 25px Georgia,serif}.kicker{color:var(--accent);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.panel{background:var(--card);border:1px solid var(--line);padding:24px;margin-top:22px;box-shadow:6px 6px 0 #cbd7d1}.grid{display:grid;grid-template-columns:280px 1fr;gap:22px}label{display:block;color:var(--muted);font-size:11px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;margin:15px 0 6px}input,textarea,select{font:inherit;width:100%;padding:11px;border:1px solid #aebbb5;background:#fbfcfa}textarea{min-height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 100px;gap:12px}button{background:var(--ink);color:#fff;border:0;padding:12px 16px;margin-top:18px;font-weight:bold;letter-spacing:.7px;cursor:pointer}button:hover{background:var(--accent)}.question{border-top:1px solid var(--line);padding:15px 0}.question:first-child{border-top:0}.question-head{display:flex;justify-content:space-between;gap:10px}.question small{color:var(--muted)}.choice-row{display:grid;grid-template-columns:35px 1fr;gap:8px;margin-top:7px}.choice-row input{width:auto}.variant{background:#f1f6f3;padding:12px;margin:10px 0}.danger{background:#a94335}.hidden{display:none}.status{color:var(--accent);font-weight:bold}.error{color:#a94335}.exam-item{border-bottom:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between}
</style></head><body><main><header><h1>Integer</h1><span class="kicker">control room / websocket linked</span></header>
<section id="login" class="panel"><span class="kicker">Secure login</span><h2>Unlock your exam desk</h2><label for="server">Backend URL</label><input id="server" type="url" placeholder="https://exam.example.com" required><label for="password">Admin password</label><input id="password" type="password"><button id="loginButton">Connect</button><p id="loginError" class="error"></p></section>
<section id="app" class="hidden"><div class="grid"><div><section class="panel"><span class="kicker">New exam</span><h2>Assemble a paper</h2><label for="title">Exam title</label><input id="title" value="Untitled exam"><label for="duration">Minutes</label><input id="duration" type="number" min="1" value="30"><div id="questions"></div><button id="add">+ Add question</button><button id="publish">Generate exam ID</button><p id="publishStatus" class="status"></p></section><section class="panel"><span class="kicker">Identity ledger</span><p style="color:var(--muted)">A user ID is single-use across the server until removed here.</p><label for="deleteUser">Delete user ID</label><input id="deleteUser"><button id="deleteButton" class="danger">Delete ID</button><p id="deleteStatus" class="status"></p></section></div><section class="panel"><span class="kicker">Live exams</span><h2>Published papers</h2><div id="examList">No papers yet.</div><p id="live" class="status">Offline</p></section></div></section>
</main><script>
let token='',questions=[];const $=id=>document.getElementById(id);const api=path=>fetch(path,{headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}});function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addQuestion(){questions.push({prompt:'',choices:['','','',''],correct:'A',letter_blocking:false,variants:[]});renderQuestions()}
function renderQuestions(){ $('questions').innerHTML=questions.map((q,i)=>`<article class="question"><div class="question-head"><b>Question ${i+1}</b><button type="button" class="danger remove" data-i="${i}">Remove</button></div><label>Prompt</label><textarea class="prompt" data-i="${i}">${esc(q.prompt)}</textarea><div class="choice-row"><b>A</b><input class="choice" data-i="${i}" data-c="0" value="${esc(q.choices[0]||'')}"></div><div class="choice-row"><b>B</b><input class="choice" data-i="${i}" data-c="1" value="${esc(q.choices[1]||'')}"></div><div class="choice-row"><b>C</b><input class="choice" data-i="${i}" data-c="2" value="${esc(q.choices[2]||'')}"></div><div class="choice-row"><b>D</b><input class="choice" data-i="${i}" data-c="3" value="${esc(q.choices[3]||'')}"></div><label>Correct answer</label><select class="correct" data-i="${i}">${['A','B','C','D','E','F'].map(x=>`<option ${q.correct===x?'selected':''}>${x}</option>`).join('')}</select><label><input class="blocking" data-i="${i}" type="checkbox" ${q.letter_blocking?'checked':''}> Mask prompt letters</label><div class="variant"><b>Variation bank</b><p><small>Add alternate prompts and choices. One variation is randomly selected per candidate.</small></p><textarea class="variant-prompt" data-i="${i}" placeholder="Optional alternate prompt"></textarea><button type="button" class="variant-add" data-i="${i}">Add variation</button><div>${q.variants.map((v,j)=>`<p><small>Variation ${j+1}: ${esc(v.prompt)}</small></p>`).join('')}</div></div></article>`).join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{questions.splice(+b.dataset.i,1);renderQuestions()});document.querySelectorAll('.prompt').forEach(e=>e.oninput=()=>questions[e.dataset.i].prompt=e.value);document.querySelectorAll('.choice').forEach(e=>e.oninput=()=>questions[e.dataset.i].choices[e.dataset.c]=e.value);document.querySelectorAll('.correct').forEach(e=>e.onchange=()=>questions[e.dataset.i].correct=e.value);document.querySelectorAll('.blocking').forEach(e=>e.onchange=()=>questions[e.dataset.i].letter_blocking=e.checked);document.querySelectorAll('.variant-add').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,input=document.querySelector(`.variant-prompt[data-i="${i}"]`);if(input.value.trim()){questions[i].variants.push({prompt:input.value,choices:questions[i].choices,correct:questions[i].correct});renderQuestions()}})}
$('loginButton').onclick=async()=>{try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;$('login').classList.add('hidden');$('app').classList.remove('hidden');addQuestion();loadExams();const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/admin?token=${token}`);ws.onopen=()=>{$('live').textContent='Live connection';};ws.onclose=()=>{$('live').textContent='Disconnected';};ws.onmessage=()=>loadExams()}catch(e){$('loginError').textContent=e.message}};
$('add').onclick=addQuestion;$('publish').onclick=async()=>{const payload={title:$('title').value,duration:+$('duration').value,questions};const response=await fetch('/api/admin/exams',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await response.json();$('publishStatus').textContent=response.ok?`Exam ID: ${d.id}`:d.error;if(response.ok)loadExams()};async function loadExams(){const r=await api('/api/admin/exams'),d=await r.json();$('examList').innerHTML=d.exams?.map(e=>`<div class="exam-item"><span><b>${esc(e.title)}</b><br><small>${e.id} · ${e.question_count} questions · ${e.used_ids} used IDs</small></span><a href="exam.html?server=${encodeURIComponent(location.origin)}&exam=${e.id}">Open</a></div>`).join('')||'No papers yet.'}$('deleteButton').onclick=async()=>{const id=$('deleteUser').value.trim();const r=await fetch(`/api/admin/users/${encodeURIComponent(id)}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});$('deleteStatus').textContent=r.ok?'User ID deleted.':(await r.json()).error;loadExams()};
const backendSettings={base:'',token:''};function backendFetch(path,options={}){options.headers={...(options.headers||{}),Authorization:`Bearer ${backendSettings.token}`,'Content-Type':'application/json'};return fetch(`${backendSettings.base}${path}`,options)}
async function backendLoadExams(){const r=await backendFetch('/api/admin/exams'),d=await r.json();$('examList').innerHTML=d.exams?.map(e=>`<div class="exam-item"><span><b>${esc(e.title)}</b><br><small>${e.id} · ${e.question_count} questions · ${e.used_ids} used IDs</small></span><a href="exam.html?server=${encodeURIComponent(backendSettings.base)}&exam=${e.id}">Open</a></div>`).join('')||'No papers yet.'}
$('loginButton').onclick=async()=>{try{backendSettings.base=$('server').value.trim().replace(/\/$/,'');if(!/^https?:\/\//i.test(backendSettings.base))throw Error('Enter a complete backend URL, including https://.');const r=await fetch(`${backendSettings.base}/api/admin/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);backendSettings.token=d.token;$('login').classList.add('hidden');$('app').classList.remove('hidden');addQuestion();backendLoadExams();const socketProtocol=backendSettings.base.startsWith('https:')?'wss:':'ws:';const socketHost=backendSettings.base.replace(/^https?:/,'');const ws=new WebSocket(`${socketProtocol}${socketHost}/ws/admin?token=${encodeURIComponent(d.token)}`);ws.onopen=()=>{$('live').textContent='Live connection';};ws.onclose=()=>{$('live').textContent='Disconnected';};ws.onmessage=()=>backendLoadExams()}catch(e){$('loginError').textContent=e.message}};
$('publish').onclick=async()=>{const response=await backendFetch('/api/admin/exams',{method:'POST',body:JSON.stringify({title:$('title').value,duration:+$('duration').value,questions})});const d=await response.json();$('publishStatus').textContent=response.ok?`Exam ID: ${d.id}`:d.error;if(response.ok)backendLoadExams()};$('deleteButton').onclick=async()=>{const id=$('deleteUser').value.trim();const r=await backendFetch(`/api/admin/users/${encodeURIComponent(id)}`,{method:'DELETE'});$('deleteStatus').textContent=r.ok?'User ID deleted.':(await r.json()).error;backendLoadExams()};
</script></body></html>
